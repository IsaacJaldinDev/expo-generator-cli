# Configuración del agente "De apuntes a exposición".
# Nada de credenciales aquí: AWS usa el perfil local (AWS_PROFILE sobreescribe aws.profile).

aws:
  profile: expo-generator
  region: us-east-2

expo:
  # Exposición activa: input/<active>.json (apuntes en knowledge/<active>/, salida en output/<active>/).
  # `--expo=<nombre>` la sobreescribe en cada comando.
  active: ejemplo

model:
  # Cambio de modelo en vivo (Acto 5): edita SOLO esta línea → claude45 | mistral | nova | claude (Sonnet 5.5, bloqueado)
  active: claude45
  options:
    nova:
      modelId: us.amazon.nova-2-lite-v1:0
      # Verificado: cache point manual al final del system prompt (mín. 1K tokens, TTL 5 min, no cachea tools)
      promptCache: cachepoint
      maxTokens: 4096
      temperature: 0.3
      # USD por 1M tokens. NO VERIFICADO: confirmar en https://aws.amazon.com/bedrock/pricing/ (us-east-2)
      pricing: { input: 0.3, output: 2.5, cacheRead: 0.075, cacheWrite: 0.0 }
    mistral:
      modelId: mistral.mistral-large-3-675b-instruct
      # Verificado: Bedrock RECHAZA cache points para este modelo
      promptCache: none
      maxTokens: 4096
      temperature: 0.3
      # NO VERIFICADO: confirmar en https://aws.amazon.com/bedrock/pricing/ (us-east-2)
      pricing: { input: 0.5, output: 1.5 }
    # Claude Sonnet 4.5: el mejor Sonnet habilitado hoy en la cuenta (verificado el 2026-10-05).
    claude45:
      modelId: us.anthropic.claude-sonnet-4-5-20250929-v1:0
      promptCache: auto # el SDK inserta los cache points (solo modelos claude/anthropic)
      maxTokens: 4096
      temperature: 0.3
      # NO VERIFICADO (precio de lista de Anthropic; el rol no tiene pricing:GetProducts):
      # confirmar en https://aws.amazon.com/bedrock/pricing/ (us-east-2)
      pricing: { input: 3.0, output: 15.0, cacheRead: 0.3, cacheWrite: 3.75 }
    # Claude Sonnet 5.5: el pedido del autor. Hoy Bedrock responde AccessDenied
    # ("not available for this account"), igual que Sonnet 5. Cuando se habilite: model.active: claude
    claude:
      modelId: us.anthropic.claude-sonnet-5-5
      promptCache: auto
      maxTokens: 4096
      temperature: 0.3
      # NO VERIFICADO
      pricing: { input: 3.0, output: 15.0, cacheRead: 0.3, cacheWrite: 3.75 }

guardrail:
  enabled: true # actívalo cuando exista el guardrail en tu cuenta
  id: "d1e4ashg6qe2" # guardrailIdentifier (ID o ARN)
  version: DRAFT
  trace: enabled # enabled | enabled_full | disabled
  # Precio USD por 1000 unidades de texto (página oficial de Bedrock, oct-2026)
  pricing: { contentFilters: 0.15, deniedTopics: 0.15, sensitiveInfo: 0.10, contextualGrounding: 0.10 }

critic:
  provider: bedrock # bedrock | ollama (ollama: aún no implementado, ver docs/ollama.md)
  # Modelo del crítico (clave de model.options). Vacío = el mismo modelo activo del agente.
  model: ""
  maxCalls: 2 # llamadas a critique_voice por ejecución

notesReview:
  # Acto 2: tus apuntes se contrastan con las fuentes. Un apunte inconsistente (la fuente dice otra cosa) detiene el
  # proceso hasta que lo corrijas (resumen en output/<expo>/revision-apuntes.md). Lo que ninguna fuente confirma ni
  # contradice no se reporta.
  stopOn: [inconsistente]

replay:
  # Velocidad del replay: 1 = latencias reales grabadas; 2 = el doble de rápido; 0 = instantáneo.
  speed: 1
  # Retraso entre eventos de streaming del modelo al reproducir (ms): que se vea natural, no instantáneo.
  eventDelayMs: 12

voice:
  maxSentenceWords: 30 # más largo → aviso (no se dice en una respiración)
  maxTriadsPerSection: 1
  maxNotXButY: 1 # "No es X, es Y" en todo el deck
  maxRhetoricalQA: 1 # pregunta retórica + respuesta inmediata en todo el deck

timing:
  wordsPerMinute: 135
  minFillRatio: 0.8 # el script debe llenar al menos el 80% de la duración del brief

agent:
  maxRevisionRounds: 2
  structuredOutputRetries: 1
  maxTurns: 30 # tope duro de turnos por ronda: si se alcanza, el agente reporta y se detiene
  maxToolCalls: 60 # tope de llamadas a herramientas por ejecución (un turno puede traer varias)

canva:
  mcpUrl: https://mcp.canva.com/mcp
  # Puerto fijo del callback OAuth en 127.0.0.1 (debe coincidir con el redirect registrado)
  redirectPort: 33418
  # Tokens OAuth: fuera del repo, permisos 0600
  tokenDir: ~/.config/expo-generator/canva
  timeoutMs: 180000 # create-design tarda ~45 s con 3 slides (con todas: sin medir); el timeout cubre consultas lentas
  # Slides que van a Canva: all = todas las del deck | 3 = hook, arquitectura y cierre (demo corta)
  slides: all
  fallbackDeckUrl: "" # URL del deck pregenerado de 35 minutos
